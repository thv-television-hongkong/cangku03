<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园物品共享租赁系统 | 区块链DApp</title>
    <script src="assets/ethers.umd.min.js"></script>
    <script src="assets/campus.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #050a18 0%, #0c1730 50%, #081022 100%);
            background-attachment: fixed;
            color: #f0f5ff;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 20%, rgba(0, 210, 255, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(140, 80, 255, 0.1) 0%, transparent 45%);
            pointer-events: none;
            z-index: 1;
        }

        .main-box {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 680px;
            padding: 40px 30px;
            margin: 20px;
            background: rgba(16, 24, 45, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 200, 255, 0.2);
            border-radius: 24px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.35),
                0 0 25px rgba(0, 180, 255, 0.15);
            text-align: center;
            transition: all 0.3s ease;
        }

        .main-box:hover {
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.4),
                0 0 35px rgba(0, 180, 255, 0.25);
        }

        .main-title {
            font-size: 46px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #00d0ff, #9c6bff, #00d0ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleShine 4s linear infinite;
            text-shadow: 0 0 30px rgba(0, 208, 255, 0.4);
        }

        @keyframes titleShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .sub-title {
            font-size: 18px;
            color: #b4c8e8;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .desc-text {
            font-size: 15px;
            color: #94a8d0;
            line-height: 1.8;
            margin-bottom: 45px;
            padding: 0 20px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 35px;
        }

        .login-btn {
            width: 100%;
            padding: 18px 24px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .login-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s ease;
        }

        .login-btn:hover::after {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-4px);
        }

        .btn-user {
            background: linear-gradient(135deg, #0088cc, #00c8ff);
            color: #001429;
            box-shadow: 0 6px 20px rgba(0, 200, 255, 0.35);
        }
        .btn-user:hover {
            box-shadow: 0 8px 28px rgba(0, 200, 255, 0.5);
        }

        .btn-seller {
            background: linear-gradient(135deg, #00a878, #00ffb3);
            color: #002218;
            box-shadow: 0 6px 20px rgba(0, 255, 179, 0.35);
        }
        .btn-seller:hover {
            box-shadow: 0 8px 28px rgba(0, 255, 179, 0.5);
        }

        .admin-area {
            margin-top: 10px;
        }

        .admin-password {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 170, 0, 0.3);
            border-radius: 12px;
            color: #f0f5ff;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 18px;
        }

        .admin-password:focus {
            border-color: #ffaa00;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-admin {
            background: linear-gradient(135deg, #cc7700, #ffaa00);
            color: #291b00;
            box-shadow: 0 6px 20px rgba(255, 170, 0, 0.35);
        }
        .btn-admin:hover {
            box-shadow: 0 8px 28px rgba(255, 170, 0, 0.5);
        }

        .copyright {
            margin-top: 40px;
            font-size: 13px;
            color: #60749c;
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            .main-title {
                font-size: 32px;
                letter-spacing: 2px;
            }
            .main-box {
                padding: 30px 20px;
            }
            .login-btn {
                padding: 16px 20px;
                font-size: 16px;
            }
            .sub-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="main-box">
        <h1 class="main-title">校园物品共享租赁系统</h1>
        <p class="sub-title">基于区块链 · 去中心化可信租赁平台</p>
        <p class="desc-text">
            依托区块链技术实现租赁流程公开透明、押金自动结算、数据不可篡改，
            为校园师生提供安全、便捷、高效的物品共享租赁服务。
        </p>

        <p class="desc-text" style="margin-bottom:24px">使用 Sepolia 测试网及测试 ETH。请安装 MetaMask，选择角色后连接钱包。<br>所有租赁数据来自链上；本站不提供浏览器模拟数据。<br><a href="https://github.com/thv-television-hongkong/cangku03" style="color:#00d0ff">项目代码与使用说明</a></p>
        <div class="btn-group">
            <button class="login-btn btn-user" onclick="goUser()">
                👤 租客入口 | 租赁 / 归还 / 评价
            </button>
            <button class="login-btn btn-seller" onclick="goSeller()">
                🛒 出租者入口 | 上架 / 管理商品
            </button>
        </div>

        <div class="admin-area">
            <p class="desc-text" style="margin-bottom:16px">管理员权限由合约部署钱包验证</p>
            <button class="login-btn btn-admin" onclick="goAdmin()">
                ⚙️ 管理员入口 | 数据管理 / 用户管控
            </button>
        </div>

        <div class="copyright">
            © 2026 校园物品共享租赁系统 版权所有 | 区块链DApp应用
        </div>
    </div>

    <script>
        function goUser() {
            location.href = "user.html";
        }
        function goSeller() {
            location.href = "seller.html";
        }
        function goAdmin() { location.href = "admin.html"; }
    </script>
</body>
</html>
