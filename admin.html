<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>管理员端 | 校园物品共享租赁系统</title>
    <script src="assets/ethers.umd.min.js"></script>
    <script src="assets/campus.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #050a18 0%, #0c1730 50%, #081022 100%);
            background-attachment: fixed;
            color: #f0f5ff;
            overflow-x: hidden;
            position: relative;
            padding: 25px 15px;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 20%, rgba(0, 210, 255, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(140, 80, 255, 0.1) 0%, transparent 45%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(16, 24, 45, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 200, 255, 0.2);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            margin-bottom: 30px;
            transition: 0.3s ease;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(90deg, #ffaa00, #cc7700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }

        .header p {
            color: #b4c8e8;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .wallet-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .connect-wallet {
            padding: 14px 30px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #0088cc, #00c8ff);
            color: #001429;
            box-shadow: 0 4px 15px rgba(0, 200, 255, 0.3);
            transition: all 0.3s ease;
        }

        .connect-wallet:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 22px rgba(0, 200, 255, 0.45);
        }

        .wallet-address {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.25);
            padding: 10px 20px;
            border-radius: 10px;
            color: #00d0ff;
            font-size: 14px;
            word-break: break-all;
        }

        .grid-wrap {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 24px;
        }

        .tech-card {
            background: rgba(16, 24, 45, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 200, 255, 0.2);
            border-radius: 18px;
            padding: 26px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            transition: 0.3s ease;
        }

        .tech-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .tech-card h2 {
            font-size: 18px;
            color: #ffaa00;
            padding-bottom: 12px;
            margin-bottom: 18px;
            border-bottom: 1px dashed rgba(255, 170, 0, 0.25);
        }

        .form-item {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #b4c8e8;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(0, 200, 255, 0.2);
            border-radius: 10px;
            padding: 12px 14px;
            color: #f0f5ff;
            font-size: 15px;
            outline: none;
            transition: 0.3s ease;
        }

        input:focus {
            border-color: #00d0ff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.25);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s ease;
        }

        .btn:disabled {
            background: #2a3447 !important;
            color: #60749c !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0077aa, #00c8ff);
            color: #001429;
            box-shadow: 0 4px 12px rgba(0, 200, 255, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 200, 255, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #b32434, #ff4757);
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.25);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 71, 87, 0.4);
        }

        .full-card {
            grid-column: 1 / -1;
        }

        .info-box {
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 10px;
            padding: 16px;
            margin-top: 10px;
            color: #b4c8e8;
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 14px;
            max-height: 240px;
            overflow-y: auto;
        }

        .log-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 10px;
            padding: 14px;
            height: 180px;
            overflow-y: auto;
            margin-top: 10px;
            font-size: 13px;
            color: #a0b4d8;
            line-height: 1.6;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .grid-wrap {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 26px;
            }
            .header {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ 管理员端</h1>
            <p>数据查询、用户拉黑与解除拉黑管理</p>
            <div class="wallet-bar">
                <button class="connect-wallet" id="connectWallet">连接钱包</button>
                <span class="wallet-address" id="walletAddr">未连接钱包</span>
            </div>
        </div>
        <div class="grid-wrap">
            <!-- 商品信息查询 -->
            <div class="tech-card full-card">
                <h2>🔍 商品信息查询</h2>
                <div class="form-item">
                    <label>商品 ID</label>
                    <input type="number" id="queryGoodId" value="0">
                    <button class="btn btn-primary" id="queryGood">查询商品详情</button>
                </div>
                <div class="info-box" id="goodDetail">暂无链上数据</div>
            </div>
            <!-- 租赁交易记录查询 -->
            <div class="tech-card full-card">
                <h2>📋 租赁交易记录查询</h2>
                <div class="form-item">
                    <label>交易记录 ID</label>
                    <input type="number" id="queryRecordId" value="0">
                    <button class="btn btn-primary" id="queryRecord">查询交易记录</button>
                </div>
                <div class="info-box" id="recordDetail">暂无交易数据</div>
            </div>
            <!-- 用户拉黑管理 -->
            <div class="tech-card full-card">
                <h2>👤 用户拉黑管理</h2>
                <div class="form-item">
                    <label>拉黑地址</label>
                    <input id="blackAddr" placeholder="0x开头钱包地址">
                    <button class="btn btn-danger" id="addBlack">加入黑名单</button>
                </div>
                <div class="form-item">
                    <label>解除拉黑地址</label>
                    <input id="unBlackAddr" placeholder="0x开头钱包地址">
                    <button class="btn btn-primary" id="removeBlack">解除拉黑</button>
                </div>
            </div>
            <!-- 操作日志 -->
            <div class="tech-card full-card">
                <h2>📜 全局操作日志</h2>
                <div class="log-box" id="logBox">等待连接钱包...</div>
            </div>
        </div>
    </div>
    <script>

        let provider, signer, contract;
        let currentAddress = "";
        let logTimer = null;
        const LOG_INTERVAL = 2000;

        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }
        function isInMetaMaskBrowser() {
            return !!window.ethereum && window.ethereum.isMetaMask;
        }
        function appendLog(text) {
            const logBox = document.getElementById("logBox");
            const time = new Date().toLocaleTimeString();
            logBox.textContent += `[${time}] ${text}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }
        function clearLog() {
            document.getElementById("logBox").textContent = "";
        }
        function disableAllBtn(flag) {
            document.querySelectorAll(".btn").forEach(btn => btn.disabled = flag);
            document.querySelector(".connect-wallet").disabled = flag;
        }
        function startAutoRefreshLog() {
            if (logTimer) clearInterval(logTimer);
            logTimer = setInterval(() => {}, LOG_INTERVAL);
        }
        function stopAutoRefreshLog() {
            if (logTimer) clearInterval(logTimer);
        }

        // 连接钱包
        document.getElementById("connectWallet").addEventListener("click", async () => {
            disableAllBtn(true);
            if (window.ethereum && window.ethereum.isMetaMask) {
                try {
                    ({ provider, signer, contract, currentAddress } = await CampusRental.connect(ABI, true));
                    document.getElementById("walletAddr").innerText = currentAddress;
                    clearLog();
                    appendLog("✅ 管理员钱包连接成功：" + currentAddress);
                    startAutoRefreshLog();
                } catch (err) {
                    appendLog("❌ 连接失败：" + err.message);
                } finally {
                    disableAllBtn(false);
                }
                return;
            }
            if (isMobile()) {
                const currentUrl = window.location.href;
                const deepLink = `https://metamask.app.link/dapp/${currentUrl.replace(/^https?:\/\//, "")}`;
                window.location.href = deepLink;
                appendLog("🔗 正在跳转 MetaMask APP...");
                setTimeout(() => {
                    alert("若未跳转，请手动打开 MetaMask，进入【浏览器】访问当前页面");
                }, 1500);
                disableAllBtn(false);
                return;
            }
            alert("未检测到 MetaMask，请先安装 MetaMask 浏览器插件！");
            disableAllBtn(false);
        });

        // 查询商品
        document.getElementById("queryGood").addEventListener("click", async () => {
            if (!contract) return alert("请先连接钱包");
            const id = document.getElementById("queryGoodId").value;
            try {
                const info = await contract.getGoodInfo(id);
                const text = `商品名称：${info.name}\n押金(wei)：${info.pledge}\n日租金(wei)：${info.dayRent}\n是否上架：${info.enabled ? "是" : "否"}\n是否租赁：${info.isRented ? "是" : "否"}\n当前租客：${info.currentRenter}\n出租者地址：${info.owner}`;
                document.getElementById("goodDetail").innerText = text;
                appendLog(`🔍 查询商品 ${id} 成功`);
            } catch (err) {
                document.getElementById("goodDetail").innerText = "查询失败：" + err.message;
                appendLog("❌ 查询失败：" + err.message);
            }
        });

        // 查询交易记录
        document.getElementById("queryRecord").addEventListener("click", async () => {
            if (!contract) return alert("请先连接钱包");
            const id = document.getElementById("queryRecordId").value;
            try {
                const record = await contract.getRentRecord(id);
                const text = `关联商品ID：${record.goodId}\n租客地址：${record.renter}\n租赁开始时间(时间戳)：${record.startTime}\n订单是否完成：${record.finished ? "是" : "否"}`;
                document.getElementById("recordDetail").innerText = text;
                appendLog(`🔍 查询交易记录 ${id} 成功`);
            } catch (err) {
                document.getElementById("recordDetail").innerText = "查询失败：" + err.message;
                appendLog("❌ 查询交易记录失败：" + err.message);
            }
        });

        // 拉黑地址
        document.getElementById("addBlack").addEventListener("click", async () => {
            if (!contract) return alert("请先连接钱包");
            const addr = document.getElementById("blackAddr").value.trim();
            if (!addr) return alert("请输入地址");
            try {
                disableAllBtn(true);
                appendLog(`⚙️ 拉黑地址：${addr}`);
                const tx = await contract.setBlack(addr, true);
                await tx.wait();
                appendLog("✅ 拉黑成功");
            } catch (err) {
                appendLog("❌ 拉黑失败：" + err.message);
            } finally {
                disableAllBtn(false);
            }
        });

        // 解除拉黑
        document.getElementById("removeBlack").addEventListener("click", async () => {
            if (!contract) return alert("请先连接钱包");
            const addr = document.getElementById("unBlackAddr").value.trim();
            if (!addr) return alert("请输入地址");
            try {
                disableAllBtn(true);
                appendLog(`⚙️ 解除拉黑：${addr}`);
                const tx = await contract.setBlack(addr, false);
                await tx.wait();
                appendLog("✅ 解除拉黑成功");
            } catch (err) {
                appendLog("❌ 解除拉黑失败：" + err.message);
            } finally {
                disableAllBtn(false);
            }
        });

        window.addEventListener("beforeunload", stopAutoRefreshLog);
    </script>
</body>
</html>
